<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>way you click NO 💖</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top left, #ffd6e5, transparent 35%),
        radial-gradient(circle at bottom right, #ff6f9c, transparent 40%),
        linear-gradient(135deg, #ffb6cc, #ff7fa5);

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      filter: blur(80px);
      animation: glow 5s infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(0.8);
        opacity: 0.4;
      }

      to {
        transform: scale(1.2);
        opacity: 0.8;
      }
    }

    /* Main card */
    .celebration-card {
      position: relative;
      z-index: 5;

      width: min(90%, 650px);
      padding: 55px 35px;

      text-align: center;

      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 35px;

      box-shadow:
        0 25px 60px rgba(170, 30, 80, 0.25),
        inset 0 0 30px rgba(255, 255, 255, 0.25);

      animation: cardAppear 1.2s ease forwards;
    }

    @keyframes cardAppear {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(80px);
      }

      70% {
        transform: scale(1.05) translateY(-10px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .emoji {
      font-size: 55px;
      animation: bounce 1.5s infinite;
      display: inline-block;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-15px) rotate(5deg);
      }
    }

    h1 {
      margin-top: 15px;

      font-size: clamp(45px, 8vw, 75px);
      color: white;

      text-shadow:
        0 5px 15px rgba(180, 30, 80, 0.35);

      animation: titlePop 1.5s ease;
    }

    @keyframes titlePop {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      60% {
        transform: scale(1.15);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .subtitle {
      margin-top: 15px;

      font-size: 21px;
      color: white;

      animation: fadeUp 1.8s ease;
    }

    .birthday {
      margin-top: 25px;

      font-size: 30px;
      font-weight: bold;

      color: white;

      text-shadow: 0 3px 10px rgba(170, 20, 70, 0.3);

      animation: birthdayGlow 2s infinite alternate;
    }

    @keyframes birthdayGlow {
      from {
        transform: scale(1);
        text-shadow: 0 0 5px white;
      }

      to {
        transform: scale(1.05);
        text-shadow:
          0 0 10px white,
          0 0 25px #ff477e;
      }
    }

    .message {
      margin-top: 15px;

      font-size: 18px;
      line-height: 1.6;

      color: white;

      animation: fadeUp 2.2s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -50px;

      font-size: 25px;

      animation: floatHeart linear infinite;

      pointer-events: none;
    }

    @keyframes floatHeart {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Confetti */
    .confetti {
      position: absolute;
      top: -20px;

      width: 10px;
      height: 16px;

      animation: fall linear infinite;

      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      color: white;
      font-size: 25px;

      animation: sparkle 2s infinite ease-in-out;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.5);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {

      .celebration-card {
        padding: 40px 20px;
      }

      .subtitle {
        font-size: 17px;
      }

      .birthday {
        font-size: 24px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Main celebration -->
  <div class="celebration-card">

    <div class="emoji">
      🎂💖🎉
    </div>

    <h1> OK nahi pahije naah tula gift   😜</h1>

    <p class="subtitle">
       as your wish... 💗
    </p>

    <div class="birthday">
      But still... 🎂✨
    </div>

    <div class="message">
      <strong>Happy Birthday! 💖🎉</strong>
      <br>
      Have a beautiful day! 🥳💗
      <br>
      Keep smiling always! ✨
    </div>

  </div>


  <script>

    /* Floating hearts */
    const hearts = ["💖", "💕", "💗", "❤️", "💘", "✨"];

    function createHeart() {

      const heart = document.createElement("div");

      heart.className = "heart";

      heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left =
        Math.random() * 100 + "vw";

      heart.style.fontSize =
        (18 + Math.random() * 25) + "px";

      heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 350);


    /* Confetti */
    function createConfetti() {

      const confetti = document.createElement("div");

      confetti.className = "confetti";

      confetti.style.left =
        Math.random() * 100 + "vw";

      confetti.style.background =
        `hsl(${Math.random() * 360}, 90%, 60%)`;

      confetti.style.width =
        (6 + Math.random() * 8) + "px";

      confetti.style.height =
        (8 + Math.random() * 12) + "px";

      confetti.style.animationDuration =
        (3 + Math.random() * 4) + "s";

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.remove();
      }, 8000);
    }

    setInterval(createConfetti, 120);


    /* Sparkles */
    const sparkleSymbols = ["✨", "⭐", "💫"];

    function createSparkle() {

      const sparkle = document.createElement("div");

      sparkle.className = "sparkle";

      sparkle.innerHTML =
        sparkleSymbols[
          Math.floor(Math.random() * sparkleSymbols.length)
        ];

      sparkle.style.left =
        Math.random() * 100 + "vw";

      sparkle.style.top =
        Math.random() * 100 + "vh";

      sparkle.style.animationDelay =
        Math.random() * 2 + "s";

      document.body.appendChild(sparkle);

      setTimeout(() => {
        sparkle.remove();
      }, 3000);
    }

    setInterval(createSparkle, 500);

  </script>

</body>
</html>
